[tools]
bun = "1.4.4"
just = "1.59"
node = "26"
uv = "0.13"

[tasks.skills]
description = "Install the vendored agent skills"
run = [
  "bunx skills add mattpocock/skills#v1.3.2",
  "bunx skills add thananon/9arm-skills --skill debug-mantra --skill scrutinize --skill post-mortem --skill management-talk",
  "bunx skills add cursor/plugins --skill unslop --skill technical-writing",
]

[tasks.plugins]
description = "Install the altr-skills plugin for this project only (altr-stack marketplace, local scope)"
run = [
  "claude plugin marketplace add chuan-khuna/altr-stack --scope local",
  "claude plugin install altr-skills@altr-stack --scope local",
  "claude plugin update altr-skills@altr-stack --scope local",
]

[tasks.pstack]
description = "Install the pstack plugin for this project only (cursor-plugins marketplace, local scope)"
run = [
  "claude plugin marketplace add cursor/plugins --scope local",
  "claude plugin install pstack@cursor-plugins --scope local",
  "claude plugin update pstack@cursor-plugins --scope local",
]
